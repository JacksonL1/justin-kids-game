<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>Hungry ABC Monsters</title>
<style>
  :root {
    --bg-top: #E0F7FA;
    --bg-bottom: #FFF9C4;
  }
  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    margin: 0;
    padding: 0;
  }
  body, html {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
    font-family: "Comic Sans MS", "Chalkboard SE", "Arial Rounded MT Bold", sans-serif;
    touch-action: none;
  }

  /* 1. 首屏一键开启声音遮罩 */
  #unlock-screen {
    position: fixed;
    inset: 0;
    background: linear-gradient(180deg, #A8E6CF 0%, #FFF9E6 100%);
    z-index: 999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
  }
  #unlock-icons {
    font-size: 86px;
    display: flex;
    gap: 18px;
    animation: floatIdle 1.6s infinite ease-in-out;
  }
  #start-btn {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    border: 10px solid #fff;
    background: #FF6B6B;
    color: #fff;
    font-size: 72px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 12px 0 #D64545, 0 20px 36px rgba(0,0,0,0.22);
    animation: pulseScale 1s infinite alternate ease-in-out;
  }

  /* 2. 顶部极简导航栏 */
  #top-bar {
    position: fixed;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 100;
    background: rgba(255,255,255,0.9);
    padding: 6px 14px;
    border-radius: 40px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.08);
  }
  .nav-btn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: none;
    background: #FF6B6B;
    color: #fff;
    font-size: 20px;
    font-weight: 900;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 0 #D64545;
  }
  .nav-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #D64545; }
  .nav-btn.dice { background: #4ECDC4; box-shadow: 0 4px 0 #319B94; }
  .nav-btn.park-btn { background: #00BBF9; box-shadow: 0 4px 0 #0088BA; position: relative; }
  .nav-btn.grid-btn { background: #FFB900; box-shadow: 0 4px 0 #CC9400; }

  #sticker-count-badge {
    position: absolute;
    top: -5px;
    right: -5px;
    background: #FF5252;
    color: #fff;
    font-size: 12px;
    font-weight: 900;
    padding: 2px 6px;
    border-radius: 12px;
    border: 2px solid #fff;
  }
  #word-counter {
    font-size: 18px;
    font-weight: 900;
    color: #555;
    padding: 0 6px;
  }

  /* 3. 主舞台布局 */
  #stage {
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding-top: 66px;
    position: relative;
  }

  /* 超大醒目的单词物品展示卡 + 拼写槽位 */
  #Showcase-card {
    background: #ffffff;
    border-radius: 36px;
    padding: 12px 28px 16px;
    box-shadow: 0 12px 28px rgba(0,0,0,0.1), inset 0 -6px 0 #F0ECE1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    z-index: 20;
    cursor: pointer;
    border: 6px solid #FFF;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  #Showcase-card:active {
    transform: scale(1.06);
  }
  #big-word-emoji {
    font-size: 108px;
    line-height: 1.05;
    filter: drop-shadow(0 8px 12px rgba(0,0,0,0.15));
    animation: floatIdle 2.4s infinite ease-in-out;
  }
  #header-slots {
    display: flex;
    gap: 8px;
    align-items: center;
    justify-content: center;
  }
  .h-slot {
    width: 48px;
    height: 60px;
    border-radius: 14px;
    background: #EAE0C8;
    box-shadow: inset 0 4px 0 rgba(0,0,0,0.12);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    font-weight: 900;
    color: rgba(255,255,255,0.45);
    transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    position: relative;
  }
  /* 当前需要喂食的目标字母槽位高亮闪烁 */
  .h-slot.target-now {
    background: #FFF3B0;
    color: #FF6B6B;
    border: 4px dashed #FF6B6B;
    transform: scale(1.14);
    box-shadow: 0 6px 14px rgba(255, 107, 107, 0.28);
  }
  .h-slot.filled {
    color: #fff;
    border: none;
    transform: scale(1);
    box-shadow: 0 4px 0 rgba(0,0,0,0.18);
  }

  /* 4. 百变贪吃怪兽主体 */
  #monster-zone {
    margin-top: 16px;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 15;
  }
  /* 怪兽头顶的“想吃当前字母”气泡 */
  #craving-bubble {
    position: absolute;
    top: -22px;
    right: -76px;
    background: #fff;
    border: 4px solid #333;
    border-radius: 26px;
    padding: 6px 14px;
    font-size: 32px;
    font-weight: 900;
    color: #FF5252;
    box-shadow: 0 8px 16px rgba(0,0,0,0.14);
    display: flex;
    align-items: center;
    gap: 4px;
    z-index: 30;
    animation: pulseScale 0.9s infinite alternate ease-in-out;
  }
  #craving-bubble::after {
    content: "";
    position: absolute;
    bottom: -12px;
    left: 14px;
    width: 16px;
    height: 16px;
    background: #fff;
    border-left: 4px solid #333;
    border-bottom: 4px solid #333;
    transform: rotate(-45deg);
  }

  #monster-body {
    width: 215px;
    height: 205px;
    background: #9B5DE5;
    border-radius: 65px 65px 50px 50px;
    border: 8px solid #fff;
    box-shadow: inset 0 -16px 0 rgba(0,0,0,0.15), 0 14px 28px rgba(0,0,0,0.18);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 20px 16px 18px;
    position: relative;
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.3s;
    cursor: pointer;
  }
  /* 怪兽头顶呆毛/犄角装饰 */
  #monster-horns {
    position: absolute;
    top: -34px;
    font-size: 42px;
    pointer-events: none;
  }
  /* 怪兽眼睛（眼珠会跟随手指拖动的字母转动） */
  #monster-eyes {
    display: flex;
    gap: 18px;
    margin-top: 4px;
    z-index: 2;
  }
  .m-eye {
    width: 44px;
    height: 44px;
    background: #fff;
    border-radius: 50%;
    border: 3px solid rgba(0,0,0,0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .m-pupil {
    width: 18px;
    height: 18px;
    background: #222;
    border-radius: 50%;
    position: relative;
    transition: transform 0.08s linear;
  }
  .m-pupil::after {
    content: "";
    position: absolute;
    top: 3px;
    left: 3px;
    width: 6px;
    height: 6px;
    background: #fff;
    border-radius: 50%;
  }

  /* 怪兽大嘴巴 */
  #monster-mouth {
    width: 130px;
    height: 76px;
    background: #590D22;
    border-radius: 20px 20px 60px 60px;
    border: 5px solid #333;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  /* 牙齿与小舌头 */
  .teeth-row {
    display: flex;
    gap: 10px;
  }
  .tooth {
    width: 18px;
    height: 14px;
    background: #fff;
    border-radius: 0 0 8px 8px;
  }
  .tongue {
    width: 66px;
    height: 32px;
    background: #FF4D6D;
    border-radius: 50% 50% 0 0;
  }

  /* 怪兽状态动画：张大嘴等待投喂、嚼东西、摇头拒吃 */
  #monster-body.mouth-wide {
    transform: scale(1.1);
  }
  #monster-body.mouth-wide #monster-mouth {
    height: 104px;
    width: 146px;
    background: #800F2F;
  }
  #monster-body.chewing {
    animation: monsterChew 0.22s 3 ease-in-out !important;
  }
  #monster-body.chewing #monster-mouth {
    height: 18px;
    border-radius: 20px;
  }
  #monster-body.head-shake {
    animation: rejectShake 0.45s ease-in-out !important;
  }
  #monster-body.head-shake #monster-mouth {
    height: 16px;
    width: 90px;
    border-radius: 12px;
  }

  /* 5. 底部字母饼干/糖果转盘 */
  .letter-treat {
    position: fixed;
    width: 88px;
    height: 88px;
    border-radius: 26px;
    border: 5px solid #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 52px;
    font-weight: 900;
    color: #fff;
    cursor: grab;
    z-index: 40;
    box-shadow: 0 8px 0 rgba(0,0,0,0.18), 0 12px 20px rgba(0,0,0,0.15);
    touch-action: none;
    transition: transform 0.2s, opacity 0.25s, filter 0.25s;
  }
  /* 散落零食上的装饰小角标（饼干/甜甜圈/草莓感） */
  .treat-badge {
    position: absolute;
    top: -10px;
    right: -10px;
    font-size: 24px;
    pointer-events: none;
  }
  /* 当前该吃的字母：放大、发光、上下欢快跳动 */
  .letter-treat.active-target {
    z-index: 55;
    box-shadow: 0 0 0 6px #FFE066, 0 10px 0 rgba(0,0,0,0.2), 0 16px 28px rgba(0,0,0,0.25);
    animation: targetBounce 1.1s infinite alternate ease-in-out;
  }
  /* 还没轮到的字母：半透明浅睡状态，降低4岁孩子视觉干扰 */
  .letter-treat.waiting-turn {
    opacity: 0.52;
    filter: grayscale(30%);
    transform: scale(0.9);
  }
  .letter-treat.dragging {
    cursor: grabbing;
    z-index: 80 !important;
    animation: none !important;
    transform: scale(1.22) rotate(-5deg) !important;
    opacity: 1 !important;
    filter: none !important;
  }
  .letter-treat.returning {
    transition: left 0.45s cubic-bezier(0.34, 1.56, 0.64, 1), top 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  /* 6. 吃饱后的超大物品玩具狂欢层 */
  #celebrate-layer {
    position: fixed;
    inset: 0;
    background: rgba(255, 252, 235, 0.94);
    z-index: 200;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  #celebrate-layer.show {
    display: flex;
    animation: popIn 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  #cel-emoji {
    font-size: 190px;
    line-height: 1.1;
    filter: drop-shadow(0 18px 26px rgba(0,0,0,0.2));
    transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  #cel-word {
    font-size: 74px;
    font-weight: 900;
    color: #FF5252;
    text-shadow: 0 5px 0 #fff, 0 10px 20px rgba(0,0,0,0.15);
    letter-spacing: 4px;
    margin-top: 8px;
  }
  #cel-finger {
    font-size: 46px;
    margin-top: 12px;
    animation: targetBounce 0.7s infinite alternate;
  }

  /* 7. 贴纸乐园与词库抽屉 */
  #park-modal, #drawer-modal {
    position: fixed;
    inset: 0;
    z-index: 400;
    display: none;
  }
  #park-modal {
    background: linear-gradient(180deg, #80FFDB 0%, #BCE6FF 55%, #98E072 55%, #7BC858 100%);
  }
  #park-modal.open { display: block; }
  #park-close-btn {
    position: fixed;
    top: 16px;
    right: 16px;
    width: 58px;
    height: 58px;
    border-radius: 50%;
    border: 4px solid #fff;
    background: #FF5252;
    color: #fff;
    font-size: 28px;
    font-weight: 900;
    cursor: pointer;
    z-index: 420;
  }
  .park-sticker {
    position: absolute;
    font-size: 76px;
    cursor: grab;
    filter: drop-shadow(0 8px 10px rgba(0,0,0,0.18));
    touch-action: none;
  }

  #drawer-modal {
    background: rgba(25, 32, 48, 0.85);
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }
  #drawer-modal.open { display: flex; }
  #az-filter {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
    max-width: 900px;
    margin-bottom: 12px;
  }
  .az-btn {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    border: none;
    background: #fff;
    font-weight: 900;
    font-size: 16px;
    color: #555;
    cursor: pointer;
  }
  .az-btn.active { background: #FF6B6B; color: #fff; transform: scale(1.12); }
  #word-grid {
    flex: 1;
    width: min(94vw, 900px);
    background: #FFF8E7;
    border-radius: 28px;
    padding: 16px;
    overflow-y: auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(105px, 1fr));
    gap: 12px;
    touch-action: pan-y;
  }
  .word-card {
    background: #fff;
    border-radius: 20px;
    padding: 10px 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border: 4px solid transparent;
    box-shadow: 0 4px 0 rgba(0,0,0,0.08);
  }
  .word-card.done { border-color: #4ECDC4; background: #F0FFFD; }
  .word-card .card-emoji { font-size: 44px; }
  .word-card .card-text { font-size: 17px; font-weight: 900; color: #444; margin-top: 4px; }
  #close-drawer {
    margin-top: 12px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    border: none;
    background: #FF5252;
    color: #fff;
    font-size: 28px;
    font-weight: 900;
    cursor: pointer;
  }

  /* 糖果碎屑粒子 */
  .crumb {
    position: fixed;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 90;
  }

  @keyframes floatIdle {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  @keyframes pulseScale {
    0% { transform: scale(1); }
    100% { transform: scale(1.1); }
  }
  @keyframes targetBounce {
    0% { transform: translateY(0) scale(1.06); }
    100% { transform: translateY(-14px) scale(1.15); }
  }
  @keyframes monsterChew {
    0%, 100% { transform: scale(1, 1); }
    50% { transform: scale(1.14, 0.86); }
  }
  @keyframes rejectShake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-16px) rotate(-8deg); }
    40% { transform: translateX(16px) rotate(8deg); }
    60% { transform: translateX(-12px) rotate(-5deg); }
    80% { transform: translateX(12px) rotate(5deg); }
  }
  @keyframes popIn {
    0% { transform: scale(0.4); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  @media (max-width: 680px) {
    #big-word-emoji { font-size: 86px; }
    .h-slot { width: 38px; height: 48px; font-size: 28px; border-radius: 10px; }
    #monster-body { width: 175px; height: 168px; padding: 16px 12px; }
    #monster-mouth { width: 108px; height: 62px; }
    .m-eye { width: 36px; height: 36px; }
    #craving-bubble { right: -58px; font-size: 26px; padding: 4px 12px; }
    .letter-treat { width: 72px; height: 72px; font-size: 42px; border-radius: 20px; }
    #cel-emoji { font-size: 145px; }
    #cel-word { font-size: 54px; }
  }
</style>
</head>
<body>

<!-- 1. 首屏一键开启声音 -->
<div id="unlock-screen">
  <div id="unlock-icons">🍎 👾 🍩</div>
  <button id="start-btn" aria-label="Play">▶</button>
</div>

<!-- 2. 顶部极简导航栏 -->
<div id="top-bar">
  <button class="nav-btn" id="prev-btn">◀</button>
  <span id="word-counter">1 / 210</span>
  <button class="nav-btn" id="next-btn">▶</button>
  <button class="nav-btn dice" id="random-btn">🎲</button>
  <button class="nav-btn park-btn" id="open-park-btn">
    🏞️<span id="sticker-count-badge">0</span>
  </button>
  <button class="nav-btn grid-btn" id="open-drawer-btn">📖</button>
</div>

<!-- 3. 主舞台：超大醒目物品卡 + 贪吃怪兽 -->
<div id="stage">
  <!-- 醒目物品展示卡（点击随时重读单词） -->
  <div id="Showcase-card" title="Tap to hear word">
    <div id="big-word-emoji">🍎</div>
    <div id="header-slots"></div>
  </div>

  <!-- 百变贪吃怪兽 -->
  <div id="monster-zone">
    <div id="craving-bubble">😋 <span id="craving-letter">A</span></div>
    <div id="monster-body">
      <div id="monster-horns">👑</div>
      <div id="monster-eyes">
        <div class="m-eye"><div class="m-pupil"></div></div>
        <div class="m-eye"><div class="m-pupil"></div></div>
      </div>
      <div id="monster-mouth">
        <div class="teeth-row">
          <div class="tooth"></div>
          <div class="tooth"></div>
          <div class="tooth"></div>
        </div>
        <div class="tongue"></div>
      </div>
    </div>
  </div>
</div>

<!-- 4. 吃饱后的超大物品庆典层 -->
<div id="celebrate-layer">
  <div id="cel-emoji">🍎</div>
  <div id="cel-word">APPLE</div>
  <div id="cel-finger">👆</div>
</div>

<!-- 5. 我的贴纸乐园 -->
<div id="park-modal">
  <button id="park-close-btn">✕</button>
  <div id="park-canvas" style="width:100%;height:100%;position:relative;"></div>
</div>

<!-- 6. 210词画廊抽屉 -->
<div id="drawer-modal">
  <div id="az-filter"></div>
  <div id="word-grid"></div>
  <button id="close-drawer">✕</button>
</div>

<script>
const RAW_WORD_DATA = [
  "ANT|🐜", "APPLE|🍎", "APE|🦍", "ARM|💪", "AXE|🪓", "ART|🎨", "ARK|🚢", "ARCH|🌉", "ACORN|🌰", "ANGEL|👼",
  "BAT|🦇", "BEAR|🐻", "BEE|🐝", "BIRD|🐦", "BUG|🐛", "BUS|🚌", "BOAT|⛵", "BIKE|🚲", "BALL|⚽", "BED|🛏️", "BELL|🔔", "BOOK|📖", "BOX|📦", "BAG|👜", "BONE|🦴", "BREAD|🍞",
  "CAT|🐱", "COW|🐮", "CRAB|🦀", "CAR|🚗", "CAB|🚕", "CAKE|🎂", "CORN|🌽", "CANDY|🍬", "CUP|🥤", "CAP|🧢", "COAT|🧥", "COMB|🪮", "COIN|🪙", "CLOCK|⏰", "CLOUD|☁️",
  "DOG|🐶", "DUCK|🦆", "DEER|🦌", "DOVE|🕊️", "DOLL|🎎", "DRUM|🥁", "DOOR|🚪", "DESK|🪑", "DRESS|👗", "DICE|🎲", "DONUT|🍩",
  "EGG|🥚", "EAR|👂", "EYE|👁️", "ELF|🧝", "ELK|🫎", "EAGLE|🦅",

// ==================== 极简纯净语音与轻快音效 ====================
function ensureAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

/**
 * 极简发音：只读干净的字母名（如 "A"）或单词本身（如 "apple"），不读复杂长句
 */
function speakClean(wordOrLetter, onEnd = null) {
  let finished = false;
  const done = () => {
    if (finished) return;
    finished = true;
    if (onEnd) onEnd();
  };

  try {
    cloudPlayer.pause();
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
  } catch (e) {}

  const cleanText = wordOrLetter.trim().toLowerCase();
  const encoded = encodeURIComponent(cleanText);
  cloudPlayer.onended = done;
  cloudPlayer.onerror = () => fallbackLocalTTS(cleanText, done);
  cloudPlayer.src = `https://dict.youdao.com/dictvoice?audio=${encoded}&type=2`;

  const p = cloudPlayer.play();
  if (p !== undefined) {
    p.catch(() => fallbackLocalTTS(cleanText, done));
  }
}

function fallbackLocalTTS(text, doneCallback) {
  if (!('speechSynthesis' in window)) {
    setTimeout(doneCallback, 700);
    return;
  }
  try {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.pitch = 1.2;
    u.rate = 0.95;
    u.onend = doneCallback;
    u.onerror = doneCallback;
    window.speechSynthesis.speak(u);
    setTimeout(doneCallback, 900);
  } catch (e) {
    setTimeout(doneCallback, 700);
  }
}

// 怪兽咔嚓吃饼干音效
function playChompSound() {
  ensureAudio();
  [260, 420, 580].forEach((f, i) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(f, audioCtx.currentTime + i * 0.045);
    gain.gain.setValueAtTime(0.24, audioCtx.currentTime + i * 0.045);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + i * 0.045 + 0.12);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(audioCtx.currentTime + i * 0.045);
    osc.stop(audioCtx.currentTime + i * 0.045 + 0.12);
  });
}

// 拿错字母时的轻柔弹簧提示音
function playBoingSoft() {
  ensureAudio();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(300, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(190, audioCtx.currentTime + 0.18);
  gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.2);
}

// 单词拼完欢呼音效
function playDingFanfare() {
  ensureAudio();
  [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(f, audioCtx.currentTime + i * 0.06);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime + i * 0.06);
    gain.gain.exponentialRampToValueAtTime(0.008, audioCtx.currentTime + i * 0.06 + 0.24);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(audioCtx.currentTime + i * 0.06);
    osc.stop(audioCtx.currentTime + i * 0.06 + 0.24);
  });
}

function loadWord(idx) {
  currentIdx = idx;
  expectedCharIndex = 0;
  celebrateLayer.classList.remove('show');
  clearTreats();

  const wordObj = WORDS[idx];
  const chars = wordObj.word.split('');

  wordCounter.textContent = `${idx + 1} / ${WORDS.length}`;
  bigWordEmoji.textContent = wordObj.emoji;
  applyMonsterStyle(idx);

  // 渲染物品下方的拼写槽位
  headerSlots.innerHTML = '';
  chars.forEach((ch, i) => {
    const s = document.createElement('div');
    s.className = 'h-slot' + (i === 0 ? ' target-now' : '');
    s.id = `h-slot-${i}`;
    s.textContent = ch;
    headerSlots.appendChild(s);
  });

  cravingLetter.textContent = chars[0];

  // 进场朗读一遍干净的单词名
  speakClean(wordObj.word);

  // 生成底部的字母饼干（打乱横向排列，但高亮第一个要吃的字母）
  spawnLetterTreats(wordObj, chars);
}

function spawnLetterTreats(wordObj, chars) {
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  const count = chars.length;
  const treatW = vw < 680 ? 72 : 88;

  const yBase = vh * 0.77;
  const maxSpan = Math.min(vw * 0.9, count * (treatW + 18));
  const startX = (vw - maxSpan) / 2;
  const stepX = count > 1 ? (maxSpan - treatW) / (count - 1) : 0;

  // 打乱位置索引，让孩子寻找发光的目标字母，也可以直接点击喂食
  const posIndices = Array.from({ length: count }, (_, i) => i).sort(() => Math.random() - 0.5);

  chars.forEach((ch, charOrderIdx) => {
    const treat = document.createElement('div');
    treat.className = 'letter-treat';
    treat.dataset.order = charOrderIdx;
    treat.dataset.char = ch;
    treat.style.backgroundColor = LETTER_COLORS[ch] || "#FF6B6B";

    const badgeIcon = TREAT_BADGES[(currentIdx + charOrderIdx) % TREAT_BADGES.length];
    treat.innerHTML = `<span class="treat-badge">${badgeIcon}</span><span>${ch}</span>`;

    const pIdx = posIndices[charOrderIdx];
    const homeX = startX + pIdx * stepX;
    const homeY = yBase + (pIdx % 2 === 0 ? -12 : 16);

    treat.style.left = homeX + 'px';
    treat.style.top = homeY + 'px';
    treat.dataset.homeX = homeX;
    treat.dataset.homeY = homeY;

    document.body.appendChild(treat);
    bindTreatInteraction(treat, wordObj);
  });

  updateTurnHighlights();
}

// 严格按单词拼写顺序高亮下一个要喂的字母
function updateTurnHighlights() {
  const targetChar = WORDS[currentIdx].word[expectedCharIndex];
  if (targetChar) {
    cravingLetter.textContent = targetChar;
  }

  document.querySelectorAll('.h-slot').forEach((slot, i) => {
    slot.classList.toggle('target-now', i === expectedCharIndex);
  });

  document.querySelectorAll('.letter-treat').forEach(el => {
    const order = parseInt(el.dataset.order, 10);
    if (order === expectedCharIndex) {
      el.classList.add('active-target');
      el.classList.remove('waiting-turn');
    } else {
      el.classList.remove('active-target');
      el.classList.add('waiting-turn');
    }
  });
}

// 怪兽眼珠跟随手指坐标转动
function lookAtPoint(x, y) {
  document.querySelectorAll('.m-pupil').forEach(pupil => {
    const rect = pupil.parentElement.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    const angle = Math.atan2(y - cy, x - cx);
    const dist = Math.min(9, Math.hypot(x - cx, y - cy) / 18);
    pupil.style.transform = `translate(${Math.cos(angle) * dist}px, ${Math.sin(angle) * dist}px)`;
  });
}

function resetEyes() {
  document.querySelectorAll('.m-pupil').forEach(pupil => {
    pupil.style.transform = 'translate(0, 0)';
  });
}

// 撒出彩色饼干碎屑特效
function burstCrumbs(x, y, color) {
  for (let i = 0; i < 10; i++) {
    const c = document.createElement('div');
    c.className = 'crumb';
    c.style.backgroundColor = color;
    c.style.left = x + 'px';
    c.style.top = y + 'px';
    document.body.appendChild(c);

    const angle = (Math.PI * 2 * i) / 10;
    const dist = 40 + Math.random() * 55;
    const tx = Math.cos(angle) * dist;
    const ty = Math.sin(angle) * dist;

    c.animate([
      { transform: 'translate(0, 0) scale(1)', opacity: 1 },
      { transform: `translate(${tx}px, ${ty}px) scale(0.2)`, opacity: 0 }
    ], { duration: 480, easing: 'ease-out' }).onfinish = () => c.remove();
  }
}

function bindTreatInteraction(treat, wordObj) {
  let dragging = false;
  let startX = 0, startY = 0;
  let ox = 0, oy = 0;

  treat.addEventListener('pointerdown', e => {
    treat.setPointerCapture(e.pointerId);
    dragging = true;
    startX = e.clientX;
    startY = e.clientY;

    const r = treat.getBoundingClientRect();
    ox = e.clientX - r.left;
    oy = e.clientY - r.top;

    treat.classList.remove('returning');
    treat.classList.add('dragging');

    // 点击瞬间：只干净利落地读出该字母名称（如 "A"），不放冗长语音
    speakClean(treat.dataset.char);

    const isMyTurn = (treat.dataset.char === wordObj.word[expectedCharIndex]);
    if (isMyTurn) {
      monsterBody.classList.add('mouth-wide');
    }
    lookAtPoint(e.clientX, e.clientY);
  });

  treat.addEventListener('pointermove', e => {
    if (!dragging) return;
    treat.style.left = (e.clientX - ox) + 'px';
    treat.style.top = (e.clientY - oy) + 'px';
    lookAtPoint(e.clientX, e.clientY);
  });

  const finishInteraction = e => {
    if (!dragging) return;
    dragging = false;
    treat.classList.remove('dragging');
    monsterBody.classList.remove('mouth-wide');
    resetEyes();

    const ch = treat.dataset.char;
    const targetChar = wordObj.word[expectedCharIndex];

    // 判断是否为轻点（4岁小朋友如果直接点击发光的目标字母，也会自动飞进怪兽嘴里！）
    const moveDist = Math.hypot(e.clientX - startX, e.clientY - startY);
    const mRect = monsterBody.getBoundingClientRect();
    const tRect = treat.getBoundingClientRect();
    const distToMouth = Math.hypot(
      (mRect.left + mRect.width / 2) - (tRect.left + tRect.width / 2),
      (mRect.top + mRect.height / 2) - (tRect.top + tRect.height / 2)
    );

    if (distToMouth < 145 || (moveDist < 18 && ch === targetChar)) {
      if (ch === targetChar) {
        // 顺序正确！怪兽一口吃掉（即使单词里有两个相同字母P，喂任意一个P都可以）
        const myOrder = parseInt(treat.dataset.order, 10);
        if (myOrder !== expectedCharIndex) {
          // 如果点的是同名但序号靠后的字母，与当前槽位字母交换顺序标记
          const other = document.querySelector(`.letter-treat[data-order="${expectedCharIndex}"]`);
          if (other) other.dataset.order = myOrder;
          treat.dataset.order = expectedCharIndex;
        }
        feedMonsterSuccess(treat, wordObj);
        return;
      } else {
        // 顺序不对！怪兽摇摇头闭紧嘴巴，弹回原位并再次轻读正确目标字母提示孩子
        playBoingSoft();
        monsterBody.classList.remove('head-shake');
        void monsterBody.offsetWidth;
        monsterBody.classList.add('head-shake');
        setTimeout(() => speakClean(targetChar), 260);
      }
    }

    // 弹回原来的位置
    treat.classList.add('returning');
    treat.style.left = treat.dataset.homeX + 'px';
    treat.style.top = treat.dataset.homeY + 'px';
  };

  treat.addEventListener('pointerup', finishInteraction);
  treat.addEventListener('pointercancel', finishInteraction);
}

function feedMonsterSuccess(treat, wordObj) {
  const ch = treat.dataset.char;
  const color = LETTER_COLORS[ch] || "#FF6B6B";
  const mRect = monsterBody.getBoundingClientRect();

  // 飞进怪兽嘴巴动画
  treat.style.transition = 'all 0.22s ease-in';
  treat.style.left = (mRect.left + mRect.width / 2 - 40) + 'px';
  treat.style.top = (mRect.top + mRect.height / 2 - 20) + 'px';
  treat.style.transform = 'scale(0.2)';
  treat.style.opacity = '0';

  setTimeout(() => {
    treat.remove();
    playChompSound();
    burstCrumbs(mRect.left + mRect.width / 2, mRect.top + mRect.height * 0.65, color);

    // 怪兽大口咀嚼动画 + 肚皮变圆一点点
    monsterBody.classList.remove('chewing');
    void monsterBody.offsetWidth;
    monsterBody.classList.add('chewing');
    const growScale = 1 + (expectedCharIndex + 1) * 0.04;
    monsterBody.style.transform = `scale(${growScale})`;

    // 点亮顶部对应槽位
    const slot = document.getElementById(`h-slot-${expectedCharIndex}`);
    if (slot) {
      slot.classList.remove('target-now');
      slot.classList.add('filled');
      slot.style.backgroundColor = color;
    }

    expectedCharIndex++;

    if (expectedCharIndex < wordObj.word.length) {
      updateTurnHighlights();
    } else {
      // 整个单词按顺序喂食完毕！
      setTimeout(() => showWordCelebration(wordObj), 500);
    }
  }, 200);
}

// ==================== 喂饱后的超大物品玩具狂欢 ====================

  playDingFanfare();

  if (!completedSet.has(currentIdx)) {
    completedSet.add(currentIdx);
    stickerBadge.textContent = completedSet.size;
    addStickerToPark(wordObj);
  }

  celEmoji.textContent = wordObj.emoji;
  celWord.textContent = wordObj.word;
  celEmoji.style.transform = 'scale(1)';
  celebrateLayer.classList.add('show');

  // 干净利落朗读单词
  speakClean(wordObj.word);

  let taps = 0;
  celebrateLayer.onclick = () => {
    taps++;
    playChompSound();
    celEmoji.style.transform = `scale(${taps % 2 === 0 ? 1.25 : 0.85}) rotate(${taps % 2 === 0 ? 12 : -12}deg)`;
    speakClean(wordObj.word);

    if (taps >= 2) {
      celebrateLayer.onclick = null;
      setTimeout(() => {
        loadWord((currentIdx + 1) % WORDS.length);
      }, 850);
    }
  };
}

    const r = s.getBoundingClientRect();
    ox = e.clientX - r.left;
    oy = e.clientY - r.top;
    speakClean(wordObj.word);
  });
  s.addEventListener('pointermove', e => {
    if (!dragging) return;
    s.style.left = (e.clientX - ox) + 'px';
    s.style.top = (e.clientY - oy) + 'px';
  });
  s.addEventListener('pointerup', () => dragging = false);
  s.addEventListener('pointercancel', () => dragging = false);

  parkCanvas.appendChild(s);
}

const drawerModal = document.getElementById('drawer-modal');
const azFilter = document.getElementById('az-filter');
const wordGrid = document.getElementById('word-grid');

document.getElementById('open-drawer-btn').onclick = () => {
  renderDrawer();
  drawerModal.classList.add('open');
};
document.getElementById('close-drawer').onclick = () => drawerModal.classList.remove('open');

function renderDrawer() {
  azFilter.innerHTML = '';
  const allBtn = document.createElement('button');
  allBtn.className = 'az-btn' + (activeLetterFilter === 'ALL' ? ' active' : '');
  allBtn.textContent = 'ALL';
  allBtn.onclick = () => { activeLetterFilter = 'ALL'; renderDrawer(); };
  azFilter.appendChild(allBtn);

  "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").forEach(letter => {
    const b = document.createElement('button');
    b.className = 'az-btn' + (activeLetterFilter === letter ? ' active' : '');
    b.textContent = letter;
    b.onclick = () => { activeLetterFilter = letter; renderDrawer(); };
    azFilter.appendChild(b);
  });

  wordGrid.innerHTML = '';
  WORDS.forEach((item, i) => {
    if (activeLetterFilter !== 'ALL' && item.word[0] !== activeLetterFilter) return;
    const card = document.createElement('div');
    card.className = 'word-card' + (completedSet.has(i) ? ' done' : '');
    card.innerHTML = `<div class="card-emoji">${item.emoji}</div><div class="card-text">${item.word}</div>`;
    card.onclick = () => {
      drawerModal.classList.remove('open');
      loadWord(i);
    };
    wordGrid.appendChild(card);
  });
}
</script>
</body>
