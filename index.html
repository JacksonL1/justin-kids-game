1. **修复字母“A”读成“额（/ə/）”的问题 & 100% 纯正美式发音**：
   - **原因分析**：之前点击字母 `A` 时，代码把小写的 `"a"` 传给了词典发音接口，英语词典会把单独的小写 `a` 当作不定冠词（a book 的 a），因此读成了弱读音“额 `/ə/`”。
   - **修复方案**：内置了 **26个字母的标准字母名（Letter Names）映射表**（例如点击 `A` 时强制请求字母本音 `/eɪ/`，点击 `I` 读 `/aɪ/`，点击 `Z` 读 `zee`），同时在离线语音引擎中强制锁定母语级英文语音包（如 iOS 的 `Samantha`、Android 的 `Google US English`），彻底杜绝中式腔调或“额”的发音。
2. **全自动本地学习进度保存（`localStorage` 持久化）**：
   - **自动记忆断点**：无论何时关闭网页或退回桌面，再次打开时会自动回到**上次所在的主题、正在学习的单词序号**。
   - **已学词库与贴纸永久保留**：所有喂饱怪兽学完的单词、贴纸乐园里收集的贴纸以及你拖动摆放好的贴纸位置都会自动保存在手机/平板里。
   - **进度统计与重置**：词库抽屉顶部新增了进度统计（如 `已学 15 / 210`）以及防误触的进度重置按钮。

  stickers: []       // { key, emoji, word, sentence, left, top }
};

function loadProgressFromStorage() {

        stickers: Array.isArray(parsed.stickers) ? parsed.stickers : []
      };
    }
  } catch (e) {}
}

function saveProgressToStorage() {

    localStorage.setItem(STORAGE_KEY, JSON.stringify(progressData));
  } catch (e) {}
}

// ==================== 4. 100% 纯正英文语音系统（杜绝中式腔调与冠词弱读） ====================
function initPreferredEnglishVoice() {
  if (!('speechSynthesis' in window)) return;
  const voices = window.speechSynthesis.getVoices();
  if (!voices || !voices.length) return;
  // 优先挑选苹果/安卓原生高质量美式母语发音人（绝不选中文语音包读英文）
  preferredEnglishVoice =
    voices.find(v => /Samantha|Alex|Victoria|Ava|Google US English/i.test(v.name) && /en/i.test(v.lang)) ||
    voices.find(v => v.lang === 'en-US') ||
    voices.find(v => /^en[-_]/i.test(v.lang)) ||
    null;
}
if ('speechSynthesis' in window) {
  initPreferredEnglishVoice();
  window.speechSynthesis.onvoiceschanged = initPreferredEnglishVoice;
}

function ensureAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

/**
 * 专门用于朗读单个英文字母（A-Z）的标准字母名发音，彻底避免 A 被读成 "额"
 */
function speakLetterName(letterChar, onEnd = null) {
  const upper = letterChar.toUpperCase();
  const phoneticWord = LETTER_VOICE_QUERY[upper] || upper;
  speakEnglishAudio(phoneticWord, upper + ".", onEnd);
}

/**
 * 专门用于朗读英文单词或英文短句
 */
function speakWordOrSentence(text, onEnd = null) {
  const clean = text.trim();
  speakEnglishAudio(clean, clean, onEnd);
}

function speakEnglishAudio(cloudQueryText, ttsFallbackText, onEnd = null) {
  let finished = false;
  const done = () => {
    if (finished) return;
    finished = true;
    if (onEnd) onEnd();
  };

  try {
    cloudPlayer.pause();
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
  } catch (e) {}

  const encoded = encodeURIComponent(cloudQueryText.toLowerCase());
  cloudPlayer.onended = done;
  cloudPlayer.onerror = () => fallbackLocalTTS(ttsFallbackText, done);
  // type=2 强制美式真人发音
  cloudPlayer.src = `[https://dict.youdao.com/dictvoice?audio=$](https://dict.youdao.com/dictvoice?audio=$){encoded}&type=2`;

  const p = cloudPlayer.play();
  if (p !== undefined) {
    p.catch(() => fallbackLocalTTS(ttsFallbackText, done));
  }
}

function fallbackLocalTTS(text, doneCallback) {
  if (!('speechSynthesis' in window)) {
    setTimeout(doneCallback, 800);
    return;
  }
  try {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    if (preferredEnglishVoice) {
      u.voice = preferredEnglishVoice;
    }
    u.pitch = 1.15;
    u.rate = 0.9;
    u.onend = doneCallback;
    u.onerror = doneCallback;
    window.speechSynthesis.speak(u);
    setTimeout(doneCallback, Math.max(950, text.length * 85));
  } catch (e) {
    setTimeout(doneCallback, 800);
  }
}

function playChompSound() {
  ensureAudio();
  [260, 420, 580].forEach((f, i) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(f, audioCtx.currentTime + i * 0.045);
    gain.gain.setValueAtTime(0.22, audioCtx.currentTime + i * 0.045);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + i * 0.045 + 0.12);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(audioCtx.currentTime + i * 0.045);
    osc.stop(audioCtx.currentTime + i * 0.045 + 0.12);
  });
}

function playBoingSoft() {
  ensureAudio();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(300, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(190, audioCtx.currentTime + 0.18);
  gain.gain.setValueAtTime(0.16, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.2);
}

function playDingFanfare() {
  ensureAudio();
  [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(f, audioCtx.currentTime + i * 0.06);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime + i * 0.06);
    gain.gain.exponentialRampToValueAtTime(0.008, audioCtx.currentTime + i * 0.06 + 0.24);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(audioCtx.currentTime + i * 0.06);
    osc.stop(audioCtx.currentTime + i * 0.06 + 0.24);
  });
}

function spawnLetterTreats(wordObj, chars) {
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  const count = chars.length;
  const treatW = vw < 680 ? 68 : 84;

  const yBase = vh * 0.79;
  const maxSpan = Math.min(vw * 0.92, count * (treatW + 16));
  const startX = (vw - maxSpan) / 2;
  const stepX = count > 1 ? (maxSpan - treatW) / (count - 1) : 0;

  const posIndices = Array.from({ length: count }, (_, i) => i).sort(() => Math.random() - 0.5);
  const badges = THEMES[currentThemeKey].treatBadges;

  chars.forEach((ch, charOrderIdx) => {
    const treat = document.createElement('div');
    treat.className = 'letter-treat';
    treat.dataset.order = charOrderIdx;
    treat.dataset.char = ch;
    treat.style.backgroundColor = LETTER_COLORS[ch] || "#FF6B6B";

    const badgeIcon = badges[(currentIdx + charOrderIdx) % badges.length];
    treat.innerHTML = `<span class="treat-badge">${badgeIcon}</span><span>${ch}</span>`;

    const pIdx = posIndices[charOrderIdx];
    const homeX = startX + pIdx * stepX;
    const homeY = yBase + (pIdx % 2 === 0 ? -10 : 14);

    treat.style.left = homeX + 'px';
    treat.style.top = homeY + 'px';
    treat.dataset.homeX = homeX;
    treat.dataset.homeY = homeY;

    document.body.appendChild(treat);
    bindTreatInteraction(treat, wordObj);
  });

  updateTurnHighlights();
}

function updateTurnHighlights() {
  const targetChar = currentWordList[currentIdx].word[expectedCharIndex];
  if (targetChar) {
    cravingLetter.textContent = targetChar;
  }

  document.querySelectorAll('.h-slot').forEach((slot, i) => {
    slot.classList.toggle('target-now', i === expectedCharIndex);
  });

  document.querySelectorAll('.letter-treat').forEach(el => {
    const order = parseInt(el.dataset.order, 10);
    if (order === expectedCharIndex) {
      el.classList.add('active-target');
      el.classList.remove('waiting-turn');
    } else {
      el.classList.remove('active-target');
      el.classList.add('waiting-turn');
    }
  });
}

function lookAtPoint(x, y) {
  document.querySelectorAll('.m-pupil').forEach(pupil => {
    const rect = pupil.parentElement.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    const angle = Math.atan2(y - cy, x - cx);
    const dist = Math.min(8, Math.hypot(x - cx, y - cy) / 18);
    pupil.style.transform = `translate(${Math.cos(angle) * dist}px, ${Math.sin(angle) * dist}px)`;
  });
}

function resetEyes() {
  document.querySelectorAll('.m-pupil').forEach(pupil => {
    pupil.style.transform = 'translate(0, 0)';
  });
}

function burstCrumbs(x, y, color) {
  for (let i = 0; i < 10; i++) {
    const c = document.createElement('div');
    c.className = 'crumb';
    c.style.backgroundColor = color;
    c.style.left = x + 'px';
    c.style.top = y + 'px';
    document.body.appendChild(c);

    const angle = (Math.PI * 2 * i) / 10;
    const dist = 40 + Math.random() * 55;
    c.animate([
      { transform: 'translate(0, 0) scale(1)', opacity: 1 },
      { transform: `translate(${Math.cos(angle) * dist}px, ${Math.sin(angle) * dist}px) scale(0.2)`, opacity: 0 }
    ], { duration: 460, easing: 'ease-out' }).onfinish = () => c.remove();
  }
}

function bindTreatInteraction(treat, wordObj) {
  let dragging = false;
  let startX = 0, startY = 0;
  let ox = 0, oy = 0;

  treat.addEventListener('pointerdown', e => {
    treat.setPointerCapture(e.pointerId);
    dragging = true;
    startX = e.clientX;
    startY = e.clientY;

    const r = treat.getBoundingClientRect();
    ox = e.clientX - r.left;
    oy = e.clientY - r.top;

    treat.classList.remove('returning');
    treat.classList.add('dragging');

    // 点击字母瞬间：使用纯正美式字母名发音（A 读 /eɪ/，绝不会有“额”的音）
    speakLetterName(treat.dataset.char);

    if (treat.dataset.char === wordObj.word[expectedCharIndex]) {
      monsterBody.classList.add('mouth-wide');
    }
    lookAtPoint(e.clientX, e.clientY);
  });

  treat.addEventListener('pointermove', e => {
    if (!dragging) return;
    treat.style.left = (e.clientX - ox) + 'px';
    treat.style.top = (e.clientY - oy) + 'px';
    lookAtPoint(e.clientX, e.clientY);
  });

  const finishInteraction = e => {
    if (!dragging) return;
    dragging = false;
    treat.classList.remove('dragging');
    monsterBody.classList.remove('mouth-wide');
    resetEyes();

    const ch = treat.dataset.char;
    const targetChar = wordObj.word[expectedCharIndex];

    const moveDist = Math.hypot(e.clientX - startX, e.clientY - startY);
    const mRect = monsterBody.getBoundingClientRect();
    const tRect = treat.getBoundingClientRect();
    const distToMouth = Math.hypot(
      (mRect.left + mRect.width / 2) - (tRect.left + tRect.width / 2),
      (mRect.top + mRect.height / 2) - (tRect.top + tRect.height / 2)
    );

    if (distToMouth < 145 || (moveDist < 18 && ch === targetChar)) {
      if (ch === targetChar) {
        const myOrder = parseInt(treat.dataset.order, 10);
        if (myOrder !== expectedCharIndex) {
          const other = document.querySelector(`.letter-treat[data-order="${expectedCharIndex}"]`);
          if (other) other.dataset.order = myOrder;
          treat.dataset.order = expectedCharIndex;
        }
        feedMonsterSuccess(treat, wordObj);
        return;
      } else {
        playBoingSoft();
        monsterBody.classList.remove('head-shake');
        void monsterBody.offsetWidth;
        monsterBody.classList.add('head-shake');
        setTimeout(() => speakLetterName(targetChar), 260);
      }
    }

    treat.classList.add('returning');
    treat.style.left = treat.dataset.homeX + 'px';
    treat.style.top = treat.dataset.homeY + 'px';
  };

  treat.addEventListener('pointerup', finishInteraction);
  treat.addEventListener('pointercancel', finishInteraction);
}

function feedMonsterSuccess(treat, wordObj) {
  const ch = treat.dataset.char;
  const color = LETTER_COLORS[ch] || "#FF6B6B";
  const mRect = monsterBody.getBoundingClientRect();

  treat.style.transition = 'all 0.22s ease-in';
  treat.style.left = (mRect.left + mRect.width / 2 - 40) + 'px';
  treat.style.top = (mRect.top + mRect.height / 2 - 20) + 'px';
  treat.style.transform = 'scale(0.2)';
  treat.style.opacity = '0';

  setTimeout(() => {
    treat.remove();
    playChompSound();
    burstCrumbs(mRect.left + mRect.width / 2, mRect.top + mRect.height * 0.65, color);

    monsterBody.classList.remove('chewing');
    void monsterBody.offsetWidth;
    monsterBody.classList.add('chewing');
    const growScale = 1 + (expectedCharIndex + 1) * 0.035;
    monsterBody.style.transform = `scale(${growScale})`;

    const slot = document.getElementById(`h-slot-${expectedCharIndex}`);
    if (slot) {
      slot.classList.remove('target-now');
      slot.classList.add('filled');
      slot.style.backgroundColor = color;
    }

    expectedCharIndex++;

    if (expectedCharIndex < wordObj.word.length) {
      updateTurnHighlights();
    } else {
      setTimeout(() => showWordAndSentenceCelebration(wordObj), 480);
    }
  }, 200);
}

      lastTheme: currentThemeKey,
      themeWordIndices: { daily: 0, christmas: 0, halloween: 0, lunar: 0 },
      completedKeys: [],
      stickers: []
    };
    stickerBadge.textContent = "0";
    parkCanvas.innerHTML = '';
    renderDrawer();
    loadWord(0);
  }
};

function renderDrawer() {
  const learnedInTheme = currentWordList.filter(w => completedSet.has(`${currentThemeKey}_${w.word}`)).length;
  drawerProgressText.textContent = `🌟 Theme Learned: ${learnedInTheme} / ${currentWordList.length} (Total: ${completedSet.size})`;

  azFilter.innerHTML = '';
  const allBtn = document.createElement('button');
  allBtn.className = 'az-btn' + (activeLetterFilter === 'ALL' ? ' active' : '');
  allBtn.textContent = 'ALL';
  allBtn.onclick = () => { activeLetterFilter = 'ALL'; renderDrawer(); };
  azFilter.appendChild(allBtn);

  const availableLetters = Array.from(new Set(currentWordList.map(w => w.word[0]))).sort();
  availableLetters.forEach(letter => {
    const b = document.createElement('button');
    b.className = 'az-btn' + (activeLetterFilter === letter ? ' active' : '');
    b.textContent = letter;
    b.onclick = () => { activeLetterFilter = letter; renderDrawer(); };
    azFilter.appendChild(b);
  });

  wordGrid.innerHTML = '';
  currentWordList.forEach((item, i) => {
    if (activeLetterFilter !== 'ALL' && item.word[0] !== activeLetterFilter) return;
    const uniqueKey = `${currentThemeKey}_${item.word}`;
    const card = document.createElement('div');
    card.className = 'word-card' + (completedSet.has(uniqueKey) ? ' done' : '');
    card.innerHTML = `<div class="card-emoji">${item.emoji}</div><div class="card-text">${item.word}</div>`;
    card.onclick = () => {
      drawerModal.classList.remove('open');
      loadWord(i);
    };
    wordGrid.appendChild(card);
  });
}
</script>
</body>
</html>
